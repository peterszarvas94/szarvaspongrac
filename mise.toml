[tools]
air = "1.65.3"
go = "1.24"
"go:github.com/a-h/templ/cmd/templ" = "v0.3.1020"
"go:github.com/peterszarvas94/templucide/cmd/templucide" = "latest"
golangci-lint = "2.12.2"

[tasks.pb]
description = "Start PocketBase (dev)"
run = "./scripts/pb-serve.sh"

[tasks.deps]
description = "Install npm devDependencies (TipTap, Tailwind, DaisyUI)"
run = "npm install"

[tasks.css]
description = "Build Tailwind CSS once"
run = "npm run css"

[tasks."css:watch"]
description = "Watch and rebuild Tailwind CSS"
run = "npm run css:watch"

[tasks.templ]
description = "Generate templ Go files"
run = "templ generate"
sources = ["**/*.templ"]
outputs = { auto = true }

[tasks."icon:add"]
description = "Add Lucide icon(s), e.g. mise run icon:add icons=search,arrow-left"
run = 'templucide add "${icons}" --output templates/shared/icons --package icons'

[tasks."icon:remove"]
description = "Remove Lucide icon(s)"
run = 'templucide remove "${icons}" --output templates/shared/icons --package icons'

[tasks."icon:sync"]
description = "Regenerate icons from registry"
run = "templucide sync --output templates/shared/icons --package icons"

[tasks."bundle:tiptap"]
description = "Bundle TipTap to static/js/vendor/tiptap.js"
run = "npm run bundle:tiptap"

[tasks.assets]
description = "Fingerprint static CSS/JS and generate import map"
run = "go run ./cmd/assets"
sources = ["cmd/assets/**/*.go", "static/importmap.json", "static/css/**", "static/js/**"]
outputs = ["static/gen/**"]

[tasks.generate]
description = "Run all code generation (templ + static CSS + TipTap bundle + assets)"
depends = ["templ", "css", "bundle:tiptap", "assets"]

[tasks.format]
run = "go fmt ./..."

[tasks.vet]
run = "go vet ./..."

[tasks.lint]
run = "golangci-lint run"

[tasks.test]
run = "go test ./..."

[tasks.build]
description = "Generate assets and build server binary"
depends = ["generate"]
run = "go build -o tmp/server ./cmd/server"

[tasks.server]
description = "Run server without hot reload"
depends = ["generate"]
run = "go run ./cmd/server"

[tasks.app]
description = "Hot reload via air"
run = "air"

[tasks.check]
description = "Format, vet, and build"
run = [
  { task = "format" },
  { task = "vet" },
  { task = "build" },
]

[tasks.preflight]
description = "Free dev server port before starting air"
run = "./scripts/dev-preflight.sh"

[tasks.dev]
description = "Hot reload Go server (start PocketBase separately: mise run pb)"
depends = ["preflight"]
run = [{ task = "app" }]

[tasks.db]
description = "Start PocketBase (dev)"
run = "./scripts/pb-serve.sh"

[tasks."sync-db"]
description = "Download prod PocketBase data to local pb/pb_data (read-only on prod)"
run = "./scripts/sync-db.sh"
