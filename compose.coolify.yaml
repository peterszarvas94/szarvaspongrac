services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:24321:4321"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      APP_ENV: production
      PORT: "4321"
      PB_URL: http://pocketbase:8090
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4321/"]
      interval: 10s
      timeout: 5s
      retries: 5
  pocketbase:
    build:
      context: .
      dockerfile: pb/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:28090:8090"
    volumes:
      - /data/shared/szarvaspongrac/pb_data:/pb/pb_data
    depends_on:
      pocketbase-restore:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
  pocketbase-restore:
    build:
      context: .
      dockerfile: pb/litestream.Dockerfile
    restart: "no"
    entrypoint: /usr/local/bin/restore-pocketbase
    volumes:
      - /data/shared/szarvaspongrac/pb_data:/pb_data
    environment: &litestream-environment
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:?}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:?}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:?}
  litestream:
    build:
      context: .
      dockerfile: pb/litestream.Dockerfile
    restart: unless-stopped
    volumes:
      - /data/shared/szarvaspongrac/pb_data:/pb_data
    environment: *litestream-environment
    depends_on:
      pocketbase:
        condition: service_healthy
