server {
    listen 80;
    server_name szarvaspongrac.hu www.szarvaspongrac.hu;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://szarvaspongrac.hu$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.szarvaspongrac.hu;
    ssl_certificate /etc/letsencrypt/live/szarvaspongrac.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szarvaspongrac.hu/privkey.pem;
    return 301 https://szarvaspongrac.hu$request_uri;
}

server {
    listen 443 ssl;
    server_name szarvaspongrac.hu;
    ssl_certificate /etc/letsencrypt/live/szarvaspongrac.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szarvaspongrac.hu/privkey.pem;
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE (/sse)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}
